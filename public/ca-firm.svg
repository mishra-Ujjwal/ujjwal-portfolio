    <text x="1362" y="474" fill="#64748b">GSTIN</text><text x="1362" y="498" fill="#f1f5f9" font-weight="700">27AABCS1234F1Z5</text>
    <text x="1362" y="536" fill="#64748b">Total</text><text x="1362" y="560" fill="#2dd4bf" font-weight="800">₹84,200</text>
