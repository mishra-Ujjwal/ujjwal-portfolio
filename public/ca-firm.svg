  <rect x="1188" y="386" width="150" height="200" rx="10" fill="#f8fafc"/>
  <g fill="#cbd5e1"><rect x="1204" y="404" width="80" height="8" rx="4"/><rect x="1204" y="426" width="118" height="6" rx="3"/><rect x="1204" y="444" width="118" height="6" rx="3"/><rect x="1204" y="462" width="96" height="6" rx="3"/><rect x="1204" y="500" width="118" height="6" rx="3"/><rect x="1204" y="518" width="118" height="6" rx="3"/></g>
  <rect x="1204" y="545" width="118" height="22" rx="4" fill="url(#acc)" opacity="0.85"/>
  <g font-size="15">
