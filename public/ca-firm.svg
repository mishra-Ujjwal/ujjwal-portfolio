  <g font-size="16" fill="#cbd5e1">
    <circle cx="1196" cy="730" r="6" fill="#22c55e"/><text x="1214" y="736">GSTR-1 filed</text><text x="1540" y="736" text-anchor="end" fill="#64748b">11 Nov</text>
    <circle cx="1196" cy="772" r="6" fill="#fbbf24"/><text x="1214" y="778">GSTR-3B pending</text><text x="1540" y="778" text-anchor="end" fill="#64748b">20 Nov</text>
    <circle cx="1196" cy="814" r="6" fill="#f87171"/><text x="1214" y="820">TDS return due</text><text x="1540" y="820" text-anchor="end" fill="#64748b">30 Nov</text>
