    <rect x="1030" y="440" width="76" height="30" rx="15" fill="#052e1a"/><text x="1068" y="461" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">Matched</text>

    <text x="378" y="520">Apex Logistics</text><text x="640" y="520">INV-1187</text><text x="790" y="520">₹1,12,000</text><text x="900" y="520">₹1,08,500</text>
    <rect x="1030" y="500" width="76" height="30" rx="15" fill="#3a2a05"/><text x="1068" y="521" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">Mismatch</text>

    <text x="378" y="580">Navkar Steel</text><text x="640" y="580">INV-9930</text><text x="790" y="580">₹2,45,600</text><text x="900" y="580">₹2,45,600</text>
    <rect x="1030" y="560" width="76" height="30" rx="15" fill="#052e1a"/><text x="1068" y="581" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">Matched</text>

    <text x="378" y="640">Orbit Packaging</text><text x="640" y="640">INV-5512</text><text x="790" y="640">₹36,900</text><text x="900" y="640">—</text>
    <rect x="1030" y="620" width="76" height="30" rx="15" fill="#3b0d0d"/><text x="1068" y="641" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700">Missing</text>

    <text x="378" y="700">Kalyani Textiles</text><text x="640" y="700">INV-3308</text><text x="790" y="700">₹58,750</text><text x="900" y="700">₹58,750</text>
